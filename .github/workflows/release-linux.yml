name: Build Linux release

on:
  push:
    tags: ["v*-linux"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 11.19.0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - name: Install packagers
        run: sudo apt-get update && sudo apt-get install -y rpm p7zip-full
      - name: Restore TorrServer data and Linux runtime
        shell: bash
        run: |
          curl -fL 'https://github.com/cyberboy1999/pirate-cinema/releases/download/v0.4.0/pirate-cinema-desktop-0.4.0-x64.nsis.7z' -o runtime.7z
          echo 'b624c8ad98957bf06e4815267c09d93ed4d7e94675708f01442410214a69a1db  runtime.7z' | sha256sum -c -
          7z x runtime.7z -obootstrap -y >/dev/null
          mkdir -p bin
          cp bootstrap/resources/torrserver/{config.db,settings.json,viewed.json,trackers.txt,rutor.ls} bin/
          curl -fL 'https://github.com/YouROK/TorrServer/releases/download/MatriX.144.2/TorrServer-linux-amd64' -o bin/TorrServer-linux-amd64
          echo '60c92e15ff2ac76d3dcebfe742ef2f0900905a6accef4329e7d3c66d8f0351dd  bin/TorrServer-linux-amd64' | sha256sum -c -
          chmod 755 bin/TorrServer-linux-amd64 scripts/install-linux.sh
          rm -rf bootstrap runtime.7z
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run lint
      - name: Validate Linux tag version
        shell: bash
        run: test "v$(node -p "require('./package.json').version")-linux" = "$GITHUB_REF_NAME"
      - run: node node_modules/vinext/dist/cli.js build
      - run: pnpm exec electron-builder --config electron-builder-linux.yml --linux deb rpm --publish never
      - name: Publish Linux packages
        shell: bash
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          cd release-linux
          sha256sum *.deb *.rpm > SHA256SUMS
          cd ..
          gh release create "$GITHUB_REF_NAME" release-linux/*.deb release-linux/*.rpm release-linux/SHA256SUMS scripts/install-linux.sh THIRD_PARTY_NOTICES.md --title "Pirate Cinema 0.4.1 for Linux" --generate-notes
