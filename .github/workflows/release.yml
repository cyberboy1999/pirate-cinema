name: Build Pirate Cinema release

on:
  workflow_dispatch:
  push:
    branches: ["codex/rust-0.6.0-release"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version=(Select-String desktop-rust/Cargo.toml -Pattern '^version = "(.+)"$').Matches.Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag does not match Cargo version $version" }
      - name: Restore verified runtimes
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/cyberboy1999/pirate-cinema/releases/download/v0.3.6/pirate-cinema-desktop-0.3.6-x64.nsis.7z' -OutFile runtime.7z
          7z x runtime.7z -obootstrap -y
          New-Item vendor/mpv,desktop-rust/vendor/torrserver -ItemType Directory -Force | Out-Null
          Copy-Item bootstrap/resources/mpv/* vendor/mpv -Recurse -Force
          Invoke-WebRequest 'https://github.com/YouROK/TorrServer/releases/download/MatriX.144/TorrServer-windows-amd64.exe' -OutFile desktop-rust/vendor/torrserver/TorrServer-windows-amd64.exe
          if ((Get-FileHash desktop-rust/vendor/torrserver/TorrServer-windows-amd64.exe -Algorithm SHA256).Hash -ne '3B68BA9409C009628BBF747A14C13F2DA4254389264A0B3903E581E897492569') { throw 'TorrServer hash mismatch' }
          if ((Get-FileHash vendor/mpv/mpv.exe -Algorithm SHA256).Hash -ne '5E3AD16B8195881B9D87EFBB4103371B7FE89205789CE4235C8F51F67C419AC2') { throw 'MPV hash mismatch' }
      - run: cargo test --manifest-path desktop-rust/Cargo.toml
      - run: cargo clippy --manifest-path desktop-rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo build --manifest-path desktop-rust/Cargo.toml --release --bin pirate-cinema
      - name: Build production NSIS installer
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $version=(Select-String desktop-rust/Cargo.toml -Pattern '^version = "(.+)"$').Matches.Groups[1].Value
          New-Item stage/mpv,stage/torrserver -ItemType Directory -Force | Out-Null
          Copy-Item desktop-rust/target/release/pirate-cinema.exe stage/
          Copy-Item vendor/mpv/* stage/mpv -Recurse
          Copy-Item desktop-rust/vendor/torrserver/TorrServer-windows-amd64.exe stage/torrserver/
          Copy-Item README.md,LICENSE,THIRD_PARTY_NOTICES.md stage/
          $makensis="${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          & $makensis "/DAPP_SOURCE=$pwd\stage" "/DAPP_OUTPUT=$pwd\Pirate-Cinema-Setup-$version-win-x64.exe" "/DAPP_ICON=$pwd\build\icon.ico" desktop-rust/installer.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: Pirate-Cinema-Setup-*-win-x64.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(sed -n 's/^version = "\(.*\)"/\1/p' desktop-rust/Cargo.toml | head -1)" = "$GITHUB_REF_NAME"
      - name: Install build and package dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libfuse2 mpv
      - name: Restore verified TorrServer
        run: |
          mkdir -p desktop-rust/vendor/torrserver
          curl -fL 'https://github.com/YouROK/TorrServer/releases/download/MatriX.144/TorrServer-linux-amd64' -o desktop-rust/vendor/torrserver/TorrServer-linux-amd64
          echo 'e93e3c3b85932eed4c98b61785fabe6379b1ee10d91998729cbdea3384af5f9d  desktop-rust/vendor/torrserver/TorrServer-linux-amd64' | sha256sum -c -
          chmod 755 desktop-rust/vendor/torrserver/TorrServer-linux-amd64 desktop-rust/packaging/*.sh
      - name: Restore pinned AppImage tools
        run: |
          curl -fL 'https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage' -o linuxdeploy-x86_64.AppImage
          echo 'c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy-x86_64.AppImage' | sha256sum -c -
          curl -fL 'https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/7a3fbc31a9e5075073ff8790f26effbac5f84453/linuxdeploy-plugin-gtk.sh' -o linuxdeploy-plugin-gtk.sh
          echo 'b0f4cbc684a0103a9651f0955b635eaea0096b3a66c0f5a2c2aa337960375171  linuxdeploy-plugin-gtk.sh' | sha256sum -c -
          curl -fL 'https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage' -o appimagetool-x86_64.AppImage
          echo 'a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0  appimagetool-x86_64.AppImage' | sha256sum -c -
          chmod 755 linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh appimagetool-x86_64.AppImage
      - run: cargo test --manifest-path desktop-rust/Cargo.toml
      - run: cargo build --manifest-path desktop-rust/Cargo.toml --release --bin pirate-cinema
      - name: Build AppImage
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' desktop-rust/Cargo.toml | head -1)
          mkdir -p release-linux
          desktop-rust/packaging/build-appimage.sh "$version" desktop-rust/target/release/pirate-cinema desktop-rust/vendor/torrserver/TorrServer-linux-amd64 release-linux "$PWD/linuxdeploy-x86_64.AppImage" "$PWD/appimagetool-x86_64.AppImage"
          (cd release-linux && sha256sum *.AppImage > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: release-linux/*

  arch-smoke:
    needs: linux
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: release-linux
      - name: Install Arch runtime dependencies
        run: pacman -Syu --noconfirm base-devel rustup mpv gtk3 webkit2gtk-4.1 libayatana-appindicator xdotool xorg-server-xvfb dbus
      - name: Smoke-test the packaged application
        shell: bash
        run: |
          rustup default stable
          cargo build --release --locked --manifest-path desktop-rust/Cargo.toml --bin pirate-cinema
          ldd desktop-rust/target/release/pirate-cinema | tee ldd.txt
          ! grep -q 'not found' ldd.txt
          set +e
          XDG_DATA_HOME="$PWD/profile-native" dbus-run-session -- xvfb-run -a timeout 20s desktop-rust/target/release/pirate-cinema
          status=$?
          set -e
          test "$status" -eq 124
          chmod 755 release-linux/Pirate-Cinema-*-x86_64.AppImage
          set +e
          XDG_DATA_HOME="$PWD/profile-appimage" dbus-run-session -- xvfb-run -a timeout 20s release-linux/Pirate-Cinema-*-x86_64.AppImage --appimage-extract-and-run
          status=$?
          set -e
          test "$status" -eq 124

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux, arch-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: publish
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" publish/* THIRD_PARTY_NOTICES.md --title "Pirate Cinema ${GITHUB_REF_NAME#v}" --notes-file docs/RELEASE_0.6.5.md
