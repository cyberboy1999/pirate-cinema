name: Build Pirate Cinema release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run lint

  windows:
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install native build tools
        run: choco install nasm -y --no-progress
      - name: Test player controller
        run: |
          node desktop-rust/tests/player-state.cjs
          node desktop-rust/tests/player-switch.cjs
          node desktop-rust/tests/player-controller.cjs
          node desktop-rust/tests/remote-controller.cjs
          node desktop-rust/tests/diagnostics-copy.cjs
          node desktop-rust/tests/rutube-player.cjs
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version=(Select-String desktop-rust/Cargo.toml -Pattern '^version = "(.+)"$').Matches.Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag does not match Cargo version $version" }
      - name: Restore verified runtime
        shell: pwsh
        run: |
          npm install --no-save ffmpeg-static@5.2.0
          New-Item stage/ffmpeg -ItemType Directory -Force | Out-Null
          Copy-Item node_modules/ffmpeg-static/ffmpeg.exe stage/ffmpeg/ffmpeg.exe
          if ((Get-FileHash stage/ffmpeg/ffmpeg.exe -Algorithm SHA256).Hash -ne 'E9FD5E711DEBAB9D680955FC1E38A2C1160FD280B144476CC3F62BC43EF49DB1') { throw 'FFmpeg hash mismatch' }
          Invoke-WebRequest 'https://download.visualstudio.microsoft.com/download/pr/990c720a-46ce-4dc7-87b9-c2eb615d34b9/CC0FF0EB1DC3F5188AE6300FAEF32BF5BEEBA4BDD6E8E445A9184072096B713B/VC_redist.x64.exe' -OutFile vc_redist.x64.exe
          if ((Get-FileHash vc_redist.x64.exe -Algorithm SHA256).Hash -ne 'CC0FF0EB1DC3F5188AE6300FAEF32BF5BEEBA4BDD6E8E445A9184072096B713B') { throw 'VC++ Redistributable hash mismatch' }
          curl.exe -fL --retry 3 'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.13/nsis-3.13.zip?download=' -o nsis-3.13.zip
          if ($LASTEXITCODE -ne 0) { throw 'NSIS download failed' }
          if ((Get-FileHash nsis-3.13.zip -Algorithm SHA256).Hash -ne 'BA63DFFC4410EE89193E1CB5A41989991BD77C61068DA17E3156D136B7B0B3D8') { throw 'NSIS hash mismatch' }
          Expand-Archive nsis-3.13.zip -DestinationPath .
      - run: cargo fmt --manifest-path desktop-rust/Cargo.toml -- --check
      - run: cargo check --manifest-path desktop-rust/Cargo.toml --all-targets --all-features
      - run: cargo test --manifest-path desktop-rust/Cargo.toml --all-targets --all-features
      - run: cargo clippy --manifest-path desktop-rust/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo build --manifest-path desktop-rust/Cargo.toml --release --bin pirate-cinema
      - name: Build production NSIS installer
        shell: pwsh
        run: |
          $version=(Select-String desktop-rust/Cargo.toml -Pattern '^version = "(.+)"$').Matches.Groups[1].Value
          Copy-Item desktop-rust/target/release/pirate-cinema.exe stage/
          Copy-Item vc_redist.x64.exe stage/
          Copy-Item README.md,LICENSE,THIRD_PARTY_NOTICES.md stage/
          $makensis="$pwd\nsis-3.13\makensis.exe"
          & $makensis "/DAPP_SOURCE=$pwd\stage" "/DAPP_OUTPUT=$pwd\Pirate-Cinema-Setup-$version-win-x64.exe" "/DAPP_ICON=$pwd\build\icon.ico" "/DAPP_VERSION=$version" desktop-rust/installer.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: Pirate-Cinema-Setup-*-win-x64.exe

  linux:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test player controller
        run: |
          node desktop-rust/tests/player-state.cjs
          node desktop-rust/tests/player-switch.cjs
          node desktop-rust/tests/player-controller.cjs
          node desktop-rust/tests/remote-controller.cjs
          node desktop-rust/tests/diagnostics-copy.cjs
          node desktop-rust/tests/rutube-player.cjs
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(sed -n 's/^version = "\(.*\)"/\1/p' desktop-rust/Cargo.toml | head -1)" = "$GITHUB_REF_NAME"
      - name: Install build and package dependencies
        run: sudo apt-get update && sudo apt-get install -y nasm libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libfuse2 ffmpeg
      - name: Restore pinned AppImage tools
        run: |
          curl -fL 'https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage' -o linuxdeploy-x86_64.AppImage
          echo 'c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy-x86_64.AppImage' | sha256sum -c -
          curl -fL 'https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/7a3fbc31a9e5075073ff8790f26effbac5f84453/linuxdeploy-plugin-gtk.sh' -o linuxdeploy-plugin-gtk.sh
          echo 'b0f4cbc684a0103a9651f0955b635eaea0096b3a66c0f5a2c2aa337960375171  linuxdeploy-plugin-gtk.sh' | sha256sum -c -
          curl -fL 'https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage' -o appimagetool-x86_64.AppImage
          echo 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool-x86_64.AppImage' | sha256sum -c -
          chmod 755 linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh appimagetool-x86_64.AppImage
      - run: cargo fmt --manifest-path desktop-rust/Cargo.toml -- --check
      - run: cargo check --manifest-path desktop-rust/Cargo.toml --all-targets --all-features
      - run: cargo test --manifest-path desktop-rust/Cargo.toml --all-targets --all-features
      - run: cargo clippy --manifest-path desktop-rust/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo build --manifest-path desktop-rust/Cargo.toml --release --bin pirate-cinema
      - name: Build AppImage
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' desktop-rust/Cargo.toml | head -1)
          mkdir -p release-linux
          chmod 755 desktop-rust/packaging/*.sh
          desktop-rust/packaging/build-appimage.sh "$version" desktop-rust/target/release/pirate-cinema release-linux "$PWD/linuxdeploy-x86_64.AppImage" "$PWD/appimagetool-x86_64.AppImage"
          (cd release-linux && sha256sum *.AppImage > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: release-linux/*

  arch-smoke:
    needs: linux
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: release-linux
      - name: Install Arch runtime dependencies
        run: pacman -Syu --noconfirm base-devel rustup nasm ffmpeg gtk3 webkit2gtk-4.1 libayatana-appindicator xdotool xorg-server-xvfb dbus
      - name: Smoke-test the packaged application
        shell: bash
        run: |
          rustup default stable
          cargo build --release --locked --manifest-path desktop-rust/Cargo.toml --bin pirate-cinema
          ldd desktop-rust/target/release/pirate-cinema | tee ldd.txt
          ! grep -q 'not found' ldd.txt
          set +e
          XDG_DATA_HOME="$PWD/profile-native" dbus-run-session -- xvfb-run -a timeout 20s desktop-rust/target/release/pirate-cinema
          status=$?
          set -e
          test "$status" -eq 124
          chmod 755 release-linux/Pirate-Cinema-*-x86_64.AppImage
          set +e
          XDG_DATA_HOME="$PWD/profile-appimage" dbus-run-session -- xvfb-run -a timeout 20s release-linux/Pirate-Cinema-*-x86_64.AppImage --appimage-extract-and-run
          status=$?
          set -e
          test "$status" -eq 124

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux, arch-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: publish
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" publish/* THIRD_PARTY_NOTICES.md --title "Pirate Cinema ${GITHUB_REF_NAME#v}" --notes-file "docs/RELEASE_${GITHUB_REF_NAME#v}.md"
