[package]
name = "pirate-cinema-core"
version = "0.8.2"
edition = "2021"
publish = false

[features]
default = ["desktop", "rutube-prototype"]
desktop = ["torrent-engine", "dep:axum", "dep:dioxus", "dioxus/desktop", "dep:rfd", "dep:tray-icon"]
rutube-prototype = []
torrent-engine = ["dep:librqbit", "dep:librqbit-dualstack-sockets", "dep:flate2", "dep:quick-xml", "tokio/rt-multi-thread", "tokio/sync", "tokio/time", "tokio/net", "serde/rc"]

[dependencies]
axum = { version = "0.8.9", optional = true }
librqbit = { version = "=9.0.1", optional = true, default-features = false, features = ["rust-tls", "http-api", "tracing-subscriber-utils"] }
librqbit-dualstack-sockets = { version = "=0.7.0", optional = true }
flate2 = { version = "1", optional = true }
quick-xml = { version = "0.37.5", optional = true }
base64 = "0.23"
dioxus = { version = "0.7.0", optional = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
getrandom = "0.3"
qrcode = { version = "0.14", default-features = false }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"], optional = true }
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
tray-icon = { version = "0.25.1", optional = true }
ureq = { version = "3.0.12", default-features = false, features = ["json", "rustls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "pirate-cinema"
path = "src/bin/dioxus.rs"
required-features = ["desktop"]
